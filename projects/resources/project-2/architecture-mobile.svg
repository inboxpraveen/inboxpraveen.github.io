  <rect class="lane" x="6" y="10" width="548" height="150" rx="16"/>
  <text class="lane-l f-client" x="16" y="34" text-anchor="start">CLIENTS</text>
  <rect class="box c-client" x="16" y="50" width="168" height="96" rx="12"/>
  <text class="t" x="100" y="84.2" text-anchor="middle">Web app</text>
  <text class="s" x="100" y="112.8" text-anchor="middle">chat, Canvas,</text>
  <text class="s" x="100" y="133.4" text-anchor="middle">Pulse, Manage</text>
  <rect class="box c-client" x="196" y="50" width="168" height="96" rx="12"/>
  <text class="t" x="280" y="84.2" text-anchor="middle">Share links</text>
  <text class="s" x="280" y="112.8" text-anchor="middle">frozen, expiring</text>
  <text class="s" x="280" y="133.4" text-anchor="middle">snapshots</text>
  <rect class="box c-client" x="376" y="50" width="168" height="96" rx="12"/>
  <text class="t" x="460" y="84.2" text-anchor="middle">Viewer portal</text>
