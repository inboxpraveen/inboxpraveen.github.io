  <text class="s" x="460" y="300.8" text-anchor="middle">allowlisted</text>
  <text class="s" x="460" y="321.4" text-anchor="middle">routes only</text>
  <rect class="lane" x="6" y="386" width="548" height="150" rx="16"/>
  <text class="lane-l f-state" x="16" y="410" text-anchor="start">STATE</text>
  <rect class="box c-state" x="16" y="426" width="168" height="96" rx="12"/>
  <text class="t" x="100" y="460.2" text-anchor="middle">Redis 7</text>
  <text class="s" x="100" y="488.8" text-anchor="middle">progress streams,</text>
  <text class="s" x="100" y="509.4" text-anchor="middle">leases, cache</text>
  <rect class="box c-state" x="196" y="426" width="348" height="96" rx="12"/>
  <text class="t" x="370" y="460.2" text-anchor="middle">PostgreSQL 16</text>
  <text class="s" x="370" y="488.8" text-anchor="middle">records and job queues,</text>
  <text class="s" x="370" y="509.4" text-anchor="middle">row-level security</text>
  <rect class="lane" x="6" y="574" width="548" height="150" rx="16"/>
  <text class="lane-l f-bg" x="16" y="598" text-anchor="start">BACKGROUND</text>
  <text class="lane-s" x="126" y="598" text-anchor="start">calls models and data</text>
  <rect class="box c-bg" x="16" y="614" width="168" height="96" rx="12"/>
  <text class="t" x="100" y="648.2" text-anchor="middle">Scheduler</text>
  <text class="s" x="100" y="676.8" text-anchor="middle">14 leased</text>
  <text class="s" x="100" y="697.4" text-anchor="middle">passes</text>
  <rect class="box c-bg" x="196" y="614" width="168" height="96" rx="12"/>
  <text class="t" x="280" y="648.2" text-anchor="middle">Worker</text>
  <text class="s" x="280" y="676.8" text-anchor="middle">ingest, sync,</text>
  <text class="s" x="280" y="697.4" text-anchor="middle">refresh, speech</text>
  <rect class="box c-bg" x="376" y="614" width="168" height="96" rx="12"/>
  <text class="t" x="460" y="648.2" text-anchor="middle">Task runner</text>
  <text class="s" x="460" y="676.8" text-anchor="middle">chat, Canvas,</text>
  <text class="s" x="460" y="697.4" text-anchor="middle">Pulse, KB chat</text>
  <rect class="lane" x="6" y="762" width="548" height="400" rx="16"/>
  <text class="lane-l f-model" x="16" y="786" text-anchor="start">MODELS</text>
  <text class="lane-s" x="116" y="786" text-anchor="start">all on-prem</text>
  <rect class="box c-model" x="16" y="802" width="528" height="128" rx="12"/>
  <text class="t" x="280" y="840.8" text-anchor="middle">Reasoning model</text>
  <text class="s" x="280" y="869.3" text-anchor="middle">vLLM on one 48 GB GPU</text>
  <text class="s" x="280" y="889.9" text-anchor="middle">mixture of experts, 4-bit, FP8 KV cache</text>
  <text class="tag f-model" x="280" y="912.9" text-anchor="middle">590 tok/s across 10 streams</text>
  <rect class="box c-model" x="16" y="944" width="258" height="84" rx="12"/>
  <text class="t" x="145" y="982.5" text-anchor="middle">Page reader</text>
  <text class="s" x="145" y="1011.1" text-anchor="middle">vision-language, llama.cpp</text>
  <rect class="box c-model" x="286" y="944" width="258" height="84" rx="12"/>
  <text class="t" x="415" y="982.5" text-anchor="middle">Embeddings, rerank</text>
  <text class="s" x="415" y="1011.1" text-anchor="middle">ONNX Runtime, int8</text>
  <rect class="box c-model" x="16" y="1040" width="258" height="84" rx="12"/>
  <text class="t" x="145" y="1078.5" text-anchor="middle">Speech in and out</text>
  <text class="s" x="145" y="1107.1" text-anchor="middle">ONNX Runtime</text>
  <rect class="box c-model" x="286" y="1040" width="258" height="84" rx="12"/>
