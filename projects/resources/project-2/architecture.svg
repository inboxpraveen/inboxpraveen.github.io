<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1110" width="1200" height="1110" role="img" aria-labelledby="t d">
  <title id="t">Docuvera360 architecture</title>
  <desc id="d">Six layers. Clients: the React web app, share links and a dashboards-only viewer portal on its own host. API: FastAPI with 451 routes that signs in, checks roles, enqueues work and returns; a separate viewer API serves allowlisted routes. State: PostgreSQL 16 holds records, job queues and row-level security; Redis 7 carries live progress streams, run leases and cache. Background: a scheduler with 14 leased passes, a worker for ingest, sync, refresh and speech, and a task runner for chat, Canvas, Pulse and KB chat, all claiming jobs from PostgreSQL with FOR UPDATE SKIP LOCKED and publishing progress to Redis. Models, all on-prem: the reasoning model on vLLM on one 48 GB GPU, a vision-language page reader on llama.cpp, embeddings and reranking and speech on ONNX Runtime, a document extractor and ClamAV. Data and sources: MinIO files, Chroma vectors, Vault secrets, and the client's seven databases, Salesforce and SharePoint, queried read-only.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8f99ab"/>
    </marker>
    <style>
