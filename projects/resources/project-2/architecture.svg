  <text class="s" x="525" y="267.4" text-anchor="middle">sign-in, role checks, then enqueue and return</text>
  <rect class="box c-client" x="890" y="198" width="280" height="84" rx="12"/>
  <text class="t" x="1030" y="236.6" text-anchor="middle">Viewer API</text>
  <text class="s" x="1030" y="267.4" text-anchor="middle">allowlisted routes only</text>
