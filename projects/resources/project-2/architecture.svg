  <text class="s" x="345" y="420.4" text-anchor="middle">live progress streams</text>
  <text class="s" x="345" y="442.4" text-anchor="middle">run leases, cache</text>
  <rect class="box c-state" x="530" y="354" width="640" height="100" rx="12"/>
  <text class="t" x="850" y="389.6" text-anchor="middle">PostgreSQL 16</text>
  <text class="s" x="850" y="420.4" text-anchor="middle">records and job queues</text>
  <text class="s" x="850" y="442.4" text-anchor="middle">row-level security on every tenant table</text>
  <rect class="box c-bg" x="180" y="538" width="290" height="100" rx="12"/>
  <text class="t" x="325" y="584.6" text-anchor="middle">Scheduler</text>
