  <text class="lane-l f-state" x="38" y="374" text-anchor="start">STATE</text>
  <rect class="lane" x="20" y="524" width="1160" height="128" rx="16"/>
  <text class="lane-l f-bg" x="38" y="558" text-anchor="start">BACKGROUND</text>
  <text class="lane-s" x="38" y="579" text-anchor="start">calls models</text>
  <rect class="lane" x="20" y="708" width="1160" height="246" rx="16"/>
  <text class="lane-l f-model" x="38" y="742" text-anchor="start">MODELS</text>
