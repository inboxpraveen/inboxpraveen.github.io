  <text class="s" x="650" y="604.4" text-anchor="middle">ingest, connector sync</text>
  <text class="s" x="650" y="626.4" text-anchor="middle">dashboard refresh, speech</text>
  <rect class="box c-bg" x="830" y="538" width="340" height="100" rx="12"/>
  <text class="t" x="1000" y="573.5" text-anchor="middle">Task runner</text>
  <text class="s" x="1000" y="604.4" text-anchor="middle">chat, Canvas authoring</text>
  <text class="s" x="1000" y="626.4" text-anchor="middle">Pulse runs, KB chat</text>
  <rect class="box c-model" x="740" y="722" width="430" height="196" rx="12"/>
  <text class="t" x="955" y="782.6" text-anchor="middle">Reasoning model</text>
  <text class="s" x="955" y="813.5" text-anchor="middle">vLLM on one 48 GB GPU</text>
  <text class="s" x="955" y="835.5" text-anchor="middle">mixture of experts, 4-bit weights</text>
  <text class="s" x="955" y="857.5" text-anchor="middle">FP8 KV cache, speculative decoding</text>
  <text class="tag f-model" x="955" y="881.3" text-anchor="middle">590 tok/s across 10 streams</text>
  <rect class="box c-model" x="180" y="722" width="262" height="90" rx="12"/>
  <text class="t" x="311" y="763.6" text-anchor="middle">Speech in and out</text>
  <text class="s" x="311" y="794.4" text-anchor="middle">ONNX Runtime</text>
  <rect class="box c-model" x="458" y="722" width="262" height="90" rx="12"/>
  <text class="t" x="589" y="763.6" text-anchor="middle">Page reader</text>
  <text class="s" x="589" y="794.4" text-anchor="middle">vision-language, llama.cpp</text>
  <rect class="box c-model" x="180" y="828" width="262" height="90" rx="12"/>
  <text class="t" x="311" y="869.6" text-anchor="middle">Extractor, ClamAV</text>
  <text class="s" x="311" y="900.4" text-anchor="middle">layout-aware parsing, virus scan</text>
  <rect class="box c-model" x="458" y="828" width="262" height="90" rx="12"/>
