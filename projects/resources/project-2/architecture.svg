      .lane-l { font: 700 13px/1 -apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif; letter-spacing: 0.12em; }
      .lane-s { font: 500 13px/1 -apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif; letter-spacing: 0.04em; fill: #6e7688; }
      .box { fill: rgba(255,255,255,0.035); stroke-width: 1.5; }
      .t { font: 600 21px/1.2 -apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif; fill: #f4f6fb; }
      .s { font: 400 15.5px/1.3 -apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif; fill: #a3acbd; }
      .tag { font: 600 14px -apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif; }
      .m { font: 500 14px ui-monospace, &quot;Cascadia Mono&quot;, Consolas, Menlo, monospace; fill: #f5b656; }
      .lbl { font: 400 14px -apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif; fill: #8f99ab; }
      .e { stroke: #8f99ab; stroke-width: 1.6; fill: none; marker-end: url(#ah); }
      .e2 { marker-start: url(#ah); }
      .d { stroke-dasharray: 5 5; }
      .note { font: 400 14px -apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif; fill: #6e7688; }
      .c-client { stroke: #4fd8ff; }
      .f-client { fill: #4fd8ff; }
      .c-state { stroke: #f5b656; }
      .f-state { fill: #f5b656; }
      .c-bg { stroke: #c9d1de; }
      .f-bg { fill: #c9d1de; }
      .c-model { stroke: #a99bff; }
      .f-model { fill: #a99bff; }
      .c-data { stroke: #5fd6a4; }
      .f-data { fill: #5fd6a4; }
    </style>
  </defs>

