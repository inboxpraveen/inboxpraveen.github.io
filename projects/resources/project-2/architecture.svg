  <text class="t" x="1030" y="80.6" text-anchor="middle">Viewer portal</text>
  <text class="s" x="1030" y="111.4" text-anchor="middle">dashboards only, own host</text>
  <rect class="box c-client" x="180" y="198" width="690" height="84" rx="12"/>
