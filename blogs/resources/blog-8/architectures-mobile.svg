  <text class="note" x="36" y="255" style="font-size:17px">every token sees every token</text>
  <text class="lbl" x="36" y="289" style="font-size:15px">READS</text>
  <text class="s" x="36" y="317" style="font-size:21px">The whole input at once, in both directions</text>
  <text class="lbl" x="36" y="359" style="font-size:15px">WRITES</text>
  <text class="s" x="36" y="387" style="font-size:21px">Nothing. A vector per token; a small head</text>
  <text class="s" x="36" y="415" style="font-size:21px">turns it into labels or scores</text>
  <text class="lbl" x="36" y="457" style="font-size:15px">COST</text>
  <text class="s" x="36" y="485" style="font-size:21px">One pass, no loop. The same cost for every</text>
  <text class="s" x="36" y="513" style="font-size:21px">input of that length</text>
  <text class="lbl" x="36" y="555" style="font-size:15px">USE FOR</text>
  <text class="s" x="36" y="583" style="font-size:21px">Classification, NER, embeddings, reranking</text>
