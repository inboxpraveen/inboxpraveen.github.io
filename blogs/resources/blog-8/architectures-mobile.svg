<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 2093" width="560" height="2093" role="img" aria-labelledby="t d">
  <title id="t">Encoder, decoder, encoder-decoder</title>
  <desc id="d">Three transformer families side by side. Encoder-only: reads the whole input at once in both directions, every token attends to every token, writes nothing itself; a small head turns its vectors into labels, spans or scores; one pass with no loop; used for classification, NER, embeddings and reranking, for example ModernBERT, mmBERT, XLM-R, DeBERTa-v3 and BGE-M3. Decoder-only: reads left to right, each token attends only to earlier tokens, writes one token at a time; the prompt is one pass and every output token is another, so output length is the latency; used for open answers, chat, reasoning and tools, for example Qwen3, Gemma 3 and Llama 3. Encoder-decoder: reads the input once in both directions, then writes token by token while attending to the whole input; used for translation, speech to text, summaries and page to text, for example Whisper, NLLB, IndicTrans2, T5 and T5Gemma.</desc>

